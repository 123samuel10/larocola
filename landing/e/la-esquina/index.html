<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>La Esquina Bar – La Rocola</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #14406B;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .logo { font-size: 2.5rem; font-weight: 900; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
    .logo span { color: #BC1F2D; }
    .bar-name { font-size: 1.1rem; color: #b0c8e8; margin-bottom: 2rem; }
    .tagline { font-size: 1.2rem; margin-bottom: 2.5rem; line-height: 1.5; }
    .btn {
      display: inline-block;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      margin: 0.5rem;
      border: none;
    }
    .btn-primary { background: #BC1F2D; color: #fff; }
    .btn-secondary {
      background: transparent;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.4);
    }
    .note { font-size: 0.85rem; color: #b0c8e8; margin-top: 1.5rem; max-width: 320px; line-height: 1.5; }
    .platform-warning { display: none; font-size: 0.9rem; color: #FF6B7A; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="logo">LA <span>ROCOLA</span></div>
  <div class="bar-name">La Esquina Bar</div>
  <p class="tagline">Pide canciones y vota por las que quieres escuchar.</p>
  <div id="actions">
    <a href="larocola://e/la-esquina" class="btn btn-primary" id="openBtn">Abrir en La Rocola</a>
    <br/>
    <a href="#" class="btn btn-secondary" id="downloadBtn">Descargar la app</a>
  </div>
  <p class="note" id="androidNote">Android: puede que debas permitir la instalación desde esta fuente.</p>
  <p class="platform-warning" id="platformWarning">La Rocola está disponible solo para Android por ahora.</p>

  <script>
    const slug = 'la-esquina';
    const apkUrl = 'https://dsopvxdfhimztngcxgdo.supabase.co/storage/v1/object/public/descargas/app-debug.apk';

    document.getElementById('downloadBtn').href = apkUrl;

    const isAndroid = /Android/i.test(navigator.userAgent);
    if (!isAndroid) {
      document.getElementById('androidNote').style.display = 'none';
      document.getElementById('platformWarning').style.display = 'block';
      document.getElementById('downloadBtn').style.display = 'none';
    }

    // Intentar abrir la app; si no abre en 1.5s, mostrar el botón de descarga más prominente
    document.getElementById('openBtn').addEventListener('click', function(e) {
      e.preventDefault();
      const start = Date.now();
      window.location.href = 'larocola://e/' + slug;
      setTimeout(function() {
        if (Date.now() - start < 2500) {
          // Si el usuario sigue aquí, la app no está instalada
          document.getElementById('downloadBtn').style.background = '#BC1F2D';
          document.getElementById('downloadBtn').style.border = 'none';
        }
      }, 1500);
    });
  </script>
</body>
</html>
